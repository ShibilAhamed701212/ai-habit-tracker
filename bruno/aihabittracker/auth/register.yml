info:
  name: Register
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8000/api/auth/register
  headers:
    - name: Content-Type
      value: application/json
      enabled: true
  body:
    type: json
    data: |-
      {
        "name": "Alex",
        "email": "alex@timetoprogram.com",
        "password": "password123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
