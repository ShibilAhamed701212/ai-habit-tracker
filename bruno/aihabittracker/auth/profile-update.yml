info:
  name: Update Profile
  type: http
  seq: 5

http:
  method: PUT
  url: http://localhost:8000/api/auth/profile
  headers:
    - name: Authorization
      value: Bearer {{token}}
      enabled: true
    - name: Content-Type
      value: application/json
      enabled: true
  body:
    type: json
    data: |-
      {
        "name": "Alex Updated",
        "morningMotivation": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
