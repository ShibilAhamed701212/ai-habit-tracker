info:
  name: Logs Habit Stats
  type: http
  seq: 16

http:
  method: GET
  url: http://localhost:8000/api/logs/stats/{{habitId}}
  headers:
    - name: Authorization
      value: Bearer {{token}}
      enabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
