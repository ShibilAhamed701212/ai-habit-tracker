info:
  name: Reorder Habits
  type: http
  seq: 10

http:
  method: PUT
  url: http://localhost:8000/api/habits/reorder
  headers:
    - name: Authorization
      value: Bearer {{token}}
      enabled: true
    - name: Content-Type
      value: application/json
      enabled: true
  body:
    type: json
    data: |-
      {
        "order": ["{{habitId}}"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
